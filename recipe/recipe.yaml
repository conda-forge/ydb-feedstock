schema_version: 1

context:
  name: ydb
  version: "3.24.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ydb-${{ version }}.tar.gz
  sha256: 9c9d30a732e3e5688b1ebb20116331932835501df4485e1ee5add9fdd42de20e

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio >=1.42.0
    - packaging
    - protobuf >=3.13.0,<6.0.0
    - aiohttp <4

tests:
  - python:
      imports:
        - ydb
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: http://github.com/ydb-platform/ydb-python-sdk
  summary: YDB Python SDK
  license: Apache-2.0
  license_file: LICENSE
  repository: http://github.com/ydb-platform/ydb-python-sdk
  documentation: https://ydb-platform.github.io/ydb-python-sdk/

extra:
  recipe-maintainers:
    - xylar
