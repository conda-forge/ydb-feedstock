schema_version: 1

context:
  name: ydb
  version: "3.26.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ydb-${{ version }}.tar.gz
  sha256: 2e4fc1e7be9e225ea7bd7f5a97abbce648c3d89a16d549ad21ddef16e3f00dfd

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - grpcio >=1.42.0
    - packaging
    - protobuf >=3.13.0,<7.0.0
    - aiohttp <4
tests:
  - python:
      imports:
        - ydb
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: http://github.com/ydb-platform/ydb-python-sdk
  summary: YDB Python SDK
  license: Apache-2.0
  license_file: LICENSE
  repository: http://github.com/ydb-platform/ydb-python-sdk
  documentation: https://ydb-platform.github.io/ydb-python-sdk/

extra:
  recipe-maintainers:
    - xylar
